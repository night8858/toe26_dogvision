# ============================================================
#  机械臂位置参数配置
# -----------------------------------------------------------
#  通过 rosparam load 加载到 arm_mission_node 命名空间，
#  节点启动时自动读取，修改后无需重新编译。
#
#  格式:
#    <组名>:          # stow_pos | pick_pos | place_pos
#      <臂别名>:      # LF | RF | LB | RB
#        x: <浮点数>
#        y: <浮点数>
#
#  臂别名映射:  0=LF(左前)  1=RF(右前)  2=LB(左后)  3=RB(右后)
# ============================================================
# ---- 启动位置 (START) ----
start_pos:
  LF: {x: 160.0, y: 220.0}
  RF: {x: 160.0, y: -220.0}
  LB: {x: -160.0, y: 220.0}
  RB: {x: -160.0, y: -220.0}

# ---- 收起位置 (STOW) ----
stow_pos:
  LF: {x: 220.0, y: 380.0}
  RF: {x: 220.0, y: -380.0}
  LB: {x: -220.0, y: 380.0}
  RB: {x: -220.0, y: -380.0}

# ---- 吸取物块位置 (PICK) ----
pick_pos:
  LF: {x: 450.0, y: 450.0}
  RF: {x: 450.0, y: -450.0}
  LB: {x: -450.0, y: 450.0}
  RB: {x: -450.0, y: -450.0}

# ---- 放置物块位置 (PLACE) ----
place_pos:
  LF: {x: 90.0, y: 900.0}
  RF: {x: 90.0, y: -900.0}
  LB: {x: -90.0, y: 900.0}
  RB: {x: -90.0, y: -900.0}
